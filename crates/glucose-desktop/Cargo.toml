[package]
name = "glucose-desktop"
# La version que la mise à jour compare (fiche 48) : toujours AU-DESSUS de la dernière publiée
# (2.0.1-beta.1, le 30/09/2026), sans quoi Glucose proposerait de se réinstaller lui-même, ou
# Glucose Tauri. « -dev » : ce n'est pas une version publiée ; la prochaine sera la 2.0.2-beta.1.
version = "2.0.2-dev"
edition = "2021"
description = "Glucose Desktop Application — PureRef-style Native Rust Desktop Client"

[dependencies]
glucose-core = { path = "../glucose-core" }
glucose-math = { path = "../glucose-math" }
winit = "0.30"
softbuffer = "0.4"
# La présentation GPU (PRESENT-1). La charte la désigne : « OpenGL ne couvre pas cette liste
# — une couche d'abstraction GPU (Vulkan + Metal + D3D + GL ES) devient donc nécessaire ».
# `pollster` bloque sur l'unique attente asynchrone de wgpu, celle de l'adaptateur, plutôt
# que d'imposer un exécuteur à toute l'application.
wgpu = "30"
pollster = "0.4"
tiny-skia = "0.11"
fontdue = "0.9"
arboard = "3.4"
rfd = "0.15"
# La vérification des mises à jour : minisign, par son auteur, sans aucune dépendance (fiche 44 § 4).
minisign-verify = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_System_Ole", "Win32_System_Com", "Win32_System_Memory", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Foundation", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_EventLog", "Win32_Security", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Time", "Win32_Networking_WinHttp", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi"] }
windows-core = "0.62"


# Le réseau hors de Windows : HTTPS par `rustls` et les racines de Mozilla, sans décompression
# (decisions/05). Sous Windows, WinHTTP le fait déjà (decisions/02).
[target.'cfg(not(windows))'.dependencies]
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

# L'offre de mémoire sous Linux et Android (`madvise`), et ce que le noyau y dit de lui.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"

[dev-dependencies]
# L'oracle de notre lecteur des documents de Glucose Tauri (`src/tauri/automerge.rs`) : la
# bibliothèque de référence, dans les épreuves et les exemples SEULEMENT. Elle n'entre jamais
# dans l'application (decisions/03).
automerge = "0.12"
# L'oracle de notre DEFLATE (`glucose_core::persist::tauri::inflate`) : ce qu'elle compresse, notre
# lecteur doit le rendre à l'octet près. Aucune caisse de plus : `png` la tire déjà (decisions/03).
miniz_oxide = "0.8"

# Une épreuve fait tomber un vrai processus pour vérifier que le journal de Windows le rend
# (`plateforme::journal`), et une autre ouvre une fenêtre cachée pour voir ce que sa file de
# messages attend (`plateforme::glisser_windows`) : des recoins de `windows`, pour les épreuves
# seulement.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging"] }
