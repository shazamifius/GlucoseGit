[package]
name = "glucose-desktop"
version = "1.0.0"
edition = "2021"
description = "Glucose Desktop Application — PureRef-style Native Rust Desktop Client"

[dependencies]
glucose-core = { path = "../glucose-core" }
glucose-math = { path = "../glucose-math" }
winit = "0.30"
softbuffer = "0.4"
# La présentation GPU (PRESENT-1). La charte la désigne : « OpenGL ne couvre pas cette liste
# — une couche d'abstraction GPU (Vulkan + Metal + D3D + GL ES) devient donc nécessaire ».
# `pollster` bloque sur l'unique attente asynchrone de wgpu, celle de l'adaptateur, plutôt
# que d'imposer un exécuteur à toute l'application.
wgpu = "30"
pollster = "0.4"
tiny-skia = "0.11"
fontdue = "0.9"
arboard = "3.4"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_System_Ole", "Win32_System_Com", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_Foundation", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange"] }
windows-core = "0.62"

