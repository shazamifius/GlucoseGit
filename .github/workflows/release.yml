name: Release

# Déclenché manuellement (workflow_dispatch) ou sur push d'un tag v*.
# Builde Glucose pour Windows + macOS (Intel + Apple Silicon) + Linux (.deb + .AppImage)
# et attache les artefacts à une nouvelle GitHub Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (ex: v0.3.0)"
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows x64 (NSIS)
            args: "--bundles nsis"
          # macos-13 (Intel) est en cours de déprécation chez GitHub Actions
          # (runners très peu disponibles). Les Macs Intel restants peuvent
          # exécuter le DMG Apple Silicon via Rosetta 2 — c'est la pratique
          # standard. Si on veut un vrai build Intel un jour : `macos-13-large`
          # (payant) ou un runner self-hosted.
          # `app` EN PLUS de `dmg`, et ce n'est pas cosmétique : sur macOS
          # l'artefact de mise à jour est un `.app.tar.gz`, produit à partir du
          # bundle `app`. En ne buildant que le DMG, on obtenait un installeur
          # mais AUCUN artefact signé — d'où l'absence totale d'entrée
          # `darwin-aarch64` dans `latest.json`, et des Macs qui installaient à
          # la main sans jamais recevoir de mise à jour ensuite.
          - os: macos-14
            target: aarch64-apple-darwin
            label: macOS Apple Silicon (DMG + updater)
            args: "--bundles app,dmg --target aarch64-apple-darwin"
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux x64 (AppImage + .deb + .rpm)
            args: "--bundles appimage,deb,rpm"

    steps:
      - uses: actions/checkout@v4

      # ── Node pour le frontend ──
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ── Rust toolchain ──
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ── Cache Rust pour accélérer les builds répétés ──
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # ── Dépendances système Linux pour Tauri ──
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            file \
            wget

      - name: Install frontend dependencies
        run: npm ci

      # ── Sanity check ──
      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # ── Build Tauri ──
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auto-update : signe les artefacts + génère/merge `latest.json` (le
          # manifeste que l'app consulte). Clé privée = secret repo (clé publique
          # dans tauri.conf.json). Sans ces secrets, le build marche mais NON signé
          # → l'updater refusera l'installation.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Glucose ${{ github.ref_name }}"
          releaseBody: |
            ## Téléchargements

            | OS | Fichier | Taille |
            |---|---|---|
            | 🪟 **Windows** (10/11) | `Glucose_*_x64-setup.exe` | NSIS · sans droits admin |
            | 🍎 **macOS** (M1+ natif, Intel via Rosetta 2) | `Glucose_*_aarch64.dmg` | universel |
            | 🐧 **Linux universel** | `glucose_*_amd64.AppImage` | Marche partout · NixOS via `nix-ld` |
            | 📦 **Debian / Ubuntu** | `glucose_*_amd64.deb` | `sudo dpkg -i` |
            | 🎩 **Fedora / RHEL** | `glucose-*.x86_64.rpm` | `sudo dnf install` |
            | ❄️ **NixOS** | flake | `nix run github:${{ github.repository }}` |

            ## Documentation
            - 📖 [Guide d'utilisation](https://github.com/${{ github.repository }}/blob/main/GUIDE.md)
            - 🗺️ [Roadmap](https://github.com/${{ github.repository }}/blob/main/ROADMAP.md)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # ══════════════════════════════════════════════════════════════════════════
  # Publication — le geste qui fait qu'une version atteint vraiment les gens.
  #
  # L'app interroge `/releases/latest/download/latest.json`, et cette URL ne voit
  # QUE les releases publiées : un brouillon n'atteint personne. Quatre des cinq
  # releases de l'historique sont restées bloquées là, faute d'un clic.
  #
  # Ce job le fait à notre place, mais SANS les deux risques d'une publication
  # directe (`releaseDraft: false`) :
  #
  #   • Les builds restent en BROUILLON pendant qu'ils tournent. Ils finissent en
  #     ordre dispersé, et un `latest.json` publié à mi-chemin ne décrirait
  #     qu'une partie des plateformes. Invisible tant qu'il est incomplet.
  #   • `needs: release` suffit à ne rien publier de cassé : si UN SEUL des trois
  #     builds échoue, ce job est SAUTÉ et la release reste brouillon.
  #
  # Et il refuse de publier un manifeste qui laisserait une plateforme de côté —
  # c'est précisément le bug qui a privé les Macs de mise à jour pendant des
  # versions entières, sans que rien ne le signale.
  # ══════════════════════════════════════════════════════════════════════════
  publish:
    name: Publier la release
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Vérifier le manifeste, puis publier
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          api() { curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
                       -H "Accept: application/vnd.github+json" "$@"; }

          # Un brouillon n'est PAS retrouvable par /releases/tags/{tag} : il faut
          # lister et filtrer soi-même.
          rel=$(api "https://api.github.com/repos/$REPO/releases?per_page=100" \
                | jq --arg t "$TAG" '.[] | select(.tag_name==$t)' | jq -s '.[0]')
          id=$(jq -r '.id // empty' <<<"$rel")
          [ -n "$id" ] || { echo "::error::Aucune release pour le tag $TAG"; exit 1; }

          asset=$(jq -r '.assets[] | select(.name=="latest.json") | .id' <<<"$rel" | head -1)
          [ -n "$asset" ] || { echo "::error::latest.json absent — rien à publier"; exit 1; }

          curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/octet-stream" \
               "https://api.github.com/repos/$REPO/releases/assets/$asset" -o latest.json

          echo "Plateformes décrites par le manifeste :"
          jq -r '.platforms | keys[]' latest.json | sed 's/^/  · /'

          # Les trois familles doivent être là. Une absente = des utilisateurs
          # qui n'auront jamais la mise à jour, en silence.
          for p in windows-x86_64 linux-x86_64 darwin-aarch64; do
            jq -e --arg p "$p" '.platforms | has($p)' latest.json > /dev/null \
              || { echo "::error::latest.json ne couvre pas $p — la release reste en brouillon"; exit 1; }
          done

          api -X PATCH "https://api.github.com/repos/$REPO/releases/$id" \
              -d '{"draft":false}' > /dev/null
          echo "::notice::$TAG publiée — l'auto-update la propose désormais à tout le monde."
