name: CI

# Ce que tout commit doit tenir, et que la machine vérifie à la place de la discipline :
# le formatage, le linter strict sans aucune alarme éteinte, tous les tests, et le noyau sans
# dépendance. Ce sont les critères de sortie que les fiches 04 (0.6) et 11 (A) demandaient.
#
# Toutes les machines qu'on ne possède pas (fiche 44, phase 1) : Windows, où le projet est
# développé et mesuré ; Linux ; Mac à puce Apple et Mac Intel ; et le noyau compilé pour les
# téléphones Android. Ces machines n'ont pas de carte graphique : les épreuves graphiques y
# passent par les rendus logiciels — WARP sous Windows, Mesa sous Linux, Metal sur Mac —, comme
# celles de wgpu. Le dépôt est public : elles ne coûtent rien (vérifié le 29/09, fiche 44 § 1.2).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un envoi plus récent rend caduque la vérification du précédent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: ${{ matrix.nom }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, nom: Windows x64 }
          - { os: ubuntu-latest, nom: Linux x64 }
          - { os: macos-14, nom: Mac à puce Apple }
          - { os: macos-15-intel, nom: Mac Intel }
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # `rfd` ouvre les dialogues natifs par GTK 3 ; Mesa donne une carte graphique logicielle
      # (lavapipe).
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev pkg-config mesa-vulkan-drivers libvulkan1

      - uses: Swatinem/rust-cache@v2

      - name: Formatage
        run: cargo fmt --all -- --check

      - name: Clippy strict
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Une carte logicielle est promise sur chaque machine : une épreuve graphique qui
      # se sauterait faute de carte mentirait en vert. Elle tombe donc (present::banc_gpu).
      # Les épreuves n'ont jamais le presse-papiers du système (interactions::presse_papiers) :
      # aucun écran n'est à fournir.
      - name: Tests
        run: cargo test --workspace --no-fail-fast
        env:
          GLUCOSE_EXIGER_UNE_CARTE: "1"

      # `cargo tree` n'imprime que le noyau lui-même quand il ne dépend de rien : une ligne.
      - name: Le noyau n'a aucune dépendance
        shell: bash
        run: |
          lignes=$(cargo tree -p glucose-core -e normal | wc -l)
          echo "cargo tree -p glucose-core : $lignes ligne(s)"
          test "$lignes" -eq 1

  android:
    name: Android, le noyau
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Les téléphones d'aujourd'hui (ARM 64 bits) et les très anciens (ARM 32 bits). Le noyau
      # seul : l'application attend son portage (fiche 44, phase 6).
      - name: Clippy strict, ARM 64 bits
        run: cargo clippy -p glucose-core -p glucose-math --all-targets --target aarch64-linux-android -- -D warnings

      - name: Clippy strict, ARM 32 bits
        run: cargo clippy -p glucose-core -p glucose-math --all-targets --target armv7-linux-androideabi -- -D warnings

  nixos:
    name: NixOS, le paquet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      # Le paquet se construit comme chez un utilisateur de NixOS (fiche 44, phase 3).
      - name: Construire le paquet
        run: nix build .#glucose -L

      # Sous NixOS, rien n'est dans un chemin standard : le binaire doit porter où trouver
      # Vulkan, le clavier, Wayland — sans quoi il ne s'ouvre pas.
      - name: Le binaire sait où trouver ce qu'il ouvre
        run: |
          chemins=$(nix run nixpkgs#patchelf -- --print-rpath result/bin/glucose-desktop)
          echo "$chemins" | tr ':' '\n'
          for lib in vulkan-loader libxkbcommon wayland; do
            echo "$chemins" | grep -q "$lib" || { echo "manque : $lib"; exit 1; }
          done

      # Le verrou des entrées est dans le dépôt : la construction est reproductible, et ne doit
      # pas le changer.
      - name: Le verrou n'a pas bougé
        run: git diff --exit-code flake.lock

  # La vie entière de Glucose sous Windows (fiche 48) : Glucose Tauri installé et ouvert, la
  # bascule vers Glucose Rust, sa mise à jour par un latest.json signé, sa désinstallation — les
  # données de l'utilisateur intactes à chaque pas. Sur une machine jetable : l'épreuve installe
  # dans le compte courant, et refuse de se lancer ailleurs.
  installeur:
    name: Windows, l'installeur et la mise à jour
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { choco install nsis -y --no-progress }

      # Une clé d'essai, tirée par le signataire de Tauri lui-même : on éprouve les signatures
      # qu'il produit. La clé de Glucose ne sort jamais de chez l'utilisateur. L'adresse et la
      # clé d'essai entrent dans le programme à la compilation (mise_a_jour::cycle).
      - name: Clé d'essai
        shell: bash
        run: |
          npx --yes @tauri-apps/cli@2 signer generate --ci -p essai -w "$RUNNER_TEMP/cle-d-essai.key"
          echo "GLUCOSE_CLE_PUBLIQUE=$(cat "$RUNNER_TEMP/cle-d-essai.key.pub")" >> "$GITHUB_ENV"
          echo "GLUCOSE_MISE_A_JOUR=http://127.0.0.1:8765/latest.json" >> "$GITHUB_ENV"

      # L'installeur ne retire jamais un dossier avec ce qu'il contient : ni lui, ni son
      # désinstalleur (lire_les_suppressions.py le lit dans le binaire).
      - name: La version N et son installeur
        shell: bash
        run: |
          cargo build --release -p glucose-desktop
          mkdir -p "$RUNNER_TEMP/n"
          cp target/release/glucose-desktop.exe "$RUNNER_TEMP/n/"
          INSTALLEUR=$(python outils/installeur/construire.py "$RUNNER_TEMP/n/glucose-desktop.exe" "$RUNNER_TEMP/n" | tail -1)
          python outils/installeur/lire_les_suppressions.py --exiger-aucune-recursive "$INSTALLEUR"
          VN=$("$RUNNER_TEMP/n/glucose-desktop.exe" --version | cut -d' ' -f2)
          echo "INSTALLEUR_N=$INSTALLEUR" >> "$GITHUB_ENV"
          echo "VN=$VN" >> "$GITHUB_ENV"

      # N+1 : la version suivante, signée, servie comme GitHub sert latest.json.
      - name: La version N+1, signée
        shell: bash
        run: |
          VN1=$(python -c "import os; n = os.environ['VN'].split('+')[0].split('-')[0].split('.'); print(f'{n[0]}.{n[1]}.{int(n[2]) + 1}')")
          sed -i -E "0,/^version = /s/^version = \".*\"/version = \"$VN1\"/" crates/glucose-desktop/Cargo.toml
          cargo build --release -p glucose-desktop
          mkdir -p "$RUNNER_TEMP/n1" "$RUNNER_TEMP/serveur"
          cp target/release/glucose-desktop.exe "$RUNNER_TEMP/n1/"
          INSTALLEUR=$(python outils/installeur/construire.py "$RUNNER_TEMP/n1/glucose-desktop.exe" "$RUNNER_TEMP/serveur" | tail -1)
          npx --yes @tauri-apps/cli@2 signer sign -f "$RUNNER_TEMP/cle-d-essai.key" -p essai "$INSTALLEUR"
          export SIG="$(cat "$INSTALLEUR.sig")" VN1 NOM="$(basename "$INSTALLEUR")"
          python -c "import json, os; print(json.dumps({'version': os.environ['VN1'], 'notes': 'epreuve', 'pub_date': '2026-01-01T00:00:00Z', 'platforms': {'windows-x86_64': {'signature': os.environ['SIG'], 'url': 'http://127.0.0.1:8765/' + os.environ['NOM']}}}))" > "$RUNNER_TEMP/serveur/latest.json"
          echo "VN1=$VN1" >> "$GITHUB_ENV"

      # Glucose Tauri tel que ses utilisateurs l'ont : la release publique 1.0.2-beta.1.
      - name: Glucose Tauri
        shell: bash
        run: curl -sSfL -o "$RUNNER_TEMP/tauri-setup.exe" https://github.com/shazamifius/GlucoseGit/releases/download/v1.0.2-beta.1/Glucose_1.0.2-beta.1_x64-setup.exe

      - name: La vie entière de Glucose sous Windows
        shell: pwsh
        run: ./outils/installeur/eprouver.ps1 -Tauri "$env:RUNNER_TEMP\tauri-setup.exe" -Installeur $env:INSTALLEUR_N -Version $env:VN -Serveur "$env:RUNNER_TEMP\serveur" -VersionSuivante $env:VN1
