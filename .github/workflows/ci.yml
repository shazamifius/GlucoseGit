name: CI

# Ce que tout commit doit tenir, et que la machine vérifie à la place de la discipline :
# le formatage, le linter strict sans aucune alarme éteinte, tous les tests, et le noyau sans
# dépendance. Ce sont les critères de sortie que les fiches 04 (0.6) et 11 (A) demandaient.
#
# Toutes les machines qu'on ne possède pas (fiche 44, phase 1) : Windows, où le projet est
# développé et mesuré ; Linux ; Mac à puce Apple et Mac Intel ; et le noyau compilé pour les
# téléphones Android. Ces machines n'ont pas de carte graphique : les épreuves graphiques y
# passent par les rendus logiciels — WARP sous Windows, Mesa sous Linux, Metal sur Mac —, comme
# celles de wgpu. Le dépôt est public : elles ne coûtent rien (vérifié le 29/09, fiche 44 § 1.2).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un envoi plus récent rend caduque la vérification du précédent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: ${{ matrix.nom }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, nom: Windows x64 }
          - { os: ubuntu-latest, nom: Linux x64 }
          - { os: macos-14, nom: Mac à puce Apple }
          - { os: macos-15-intel, nom: Mac Intel }
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # `rfd` ouvre les dialogues natifs par GTK 3 ; Mesa donne une carte graphique logicielle
      # (lavapipe).
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev pkg-config mesa-vulkan-drivers libvulkan1

      - uses: Swatinem/rust-cache@v2

      - name: Formatage
        run: cargo fmt --all -- --check

      - name: Clippy strict
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Une carte logicielle est promise sur chaque machine : une épreuve graphique qui
      # se sauterait faute de carte mentirait en vert. Elle tombe donc (present::banc_gpu).
      # Les épreuves n'ont jamais le presse-papiers du système (interactions::presse_papiers) :
      # aucun écran n'est à fournir.
      - name: Tests
        run: cargo test --workspace --no-fail-fast
        env:
          GLUCOSE_EXIGER_UNE_CARTE: "1"

      # `cargo tree` n'imprime que le noyau lui-même quand il ne dépend de rien : une ligne.
      - name: Le noyau n'a aucune dépendance
        shell: bash
        run: |
          lignes=$(cargo tree -p glucose-core -e normal | wc -l)
          echo "cargo tree -p glucose-core : $lignes ligne(s)"
          test "$lignes" -eq 1

  android:
    name: Android et le web, le noyau
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Les téléphones d'aujourd'hui (ARM 64 bits) et les très anciens (ARM 32 bits). Le noyau
      # seul : l'application attend son portage (fiche 44, phase 6).
      - name: Clippy strict, ARM 64 bits
        run: cargo clippy -p glucose-core -p glucose-math --all-targets --target aarch64-linux-android -- -D warnings

      - name: Clippy strict, ARM 32 bits
        run: cargo clippy -p glucose-core -p glucose-math --all-targets --target armv7-linux-androideabi -- -D warnings

      # L'iPad par le web (fiche 50) : le noyau dans un navigateur, en WebAssembly.
      - name: Clippy strict, WebAssembly
        run: cargo clippy -p glucose-core -p glucose-math --all-targets --target wasm32-unknown-unknown -- -D warnings

  nixos:
    name: NixOS, le paquet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      # Le paquet se construit comme chez un utilisateur de NixOS (fiche 44, phase 3).
      - name: Construire le paquet
        run: nix build .#glucose -L

      # Sous NixOS, rien n'est dans un chemin standard : le binaire doit porter où trouver
      # Vulkan, le clavier, Wayland — sans quoi il ne s'ouvre pas.
      - name: Le binaire sait où trouver ce qu'il ouvre
        run: |
          chemins=$(nix run nixpkgs#patchelf -- --print-rpath result/bin/glucose-desktop)
          echo "$chemins" | tr ':' '\n'
          for lib in vulkan-loader libxkbcommon wayland; do
            echo "$chemins" | grep -q "$lib" || { echo "manque : $lib"; exit 1; }
          done

      # Le verrou des entrées est dans le dépôt : la construction est reproductible, et ne doit
      # pas le changer.
      - name: Le verrou n'a pas bougé
        run: git diff --exit-code flake.lock

  # La vie entière de Glucose sous Windows (fiche 48) : Glucose Tauri installé et ouvert, la
  # bascule vers Glucose Rust, sa mise à jour par un latest.json signé, sa désinstallation — les
  # données de l'utilisateur intactes à chaque pas. Sur une machine jetable : l'épreuve installe
  # dans le compte courant, et refuse de se lancer ailleurs.
  installeur:
    name: Windows, l'installeur et la mise à jour
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { choco install nsis -y --no-progress }

      # Une clé d'essai, tirée par le signataire de Tauri lui-même : on éprouve les signatures
      # qu'il produit. La clé de Glucose ne sort jamais de chez l'utilisateur. L'adresse et la
      # clé d'essai entrent dans le programme à la compilation (mise_a_jour::cycle).
      - name: Clé d'essai
        shell: bash
        run: |
          npx --yes @tauri-apps/cli@2 signer generate --ci -p essai -w "$RUNNER_TEMP/cle-d-essai.key"
          echo "GLUCOSE_CLE_PUBLIQUE=$(cat "$RUNNER_TEMP/cle-d-essai.key.pub")" >> "$GITHUB_ENV"
          echo "GLUCOSE_MISE_A_JOUR=http://127.0.0.1:8765/latest.json" >> "$GITHUB_ENV"

      # L'installeur ne retire jamais un dossier avec ce qu'il contient : ni lui, ni son
      # désinstalleur (lire_les_suppressions.py le lit dans le binaire).
      - name: La version N et son installeur
        shell: bash
        run: |
          cargo build --release -p glucose-desktop
          mkdir -p "$RUNNER_TEMP/n"
          cp target/release/glucose-desktop.exe "$RUNNER_TEMP/n/"
          INSTALLEUR=$(python outils/installeur/construire.py "$RUNNER_TEMP/n/glucose-desktop.exe" "$RUNNER_TEMP/n" | tail -1)
          python outils/installeur/lire_les_suppressions.py --exiger-aucune-recursive "$INSTALLEUR"
          VN=$("$RUNNER_TEMP/n/glucose-desktop.exe" --version | cut -d' ' -f2)
          # Une construction d'épreuve porte une autre adresse et une autre clé : la preuve de la
          # publication (publier.yml) doit la refuser — sans quoi elle ne prouverait rien.
          cargo build --release -p glucose-desktop --example publication
          if target/release/examples/publication programme "$RUNNER_TEMP/n/glucose-desktop.exe" "$VN"; then
            echo "::error::une construction d'épreuve passerait pour publiable"; exit 1
          fi
          echo "INSTALLEUR_N=$INSTALLEUR" >> "$GITHUB_ENV"
          echo "VN=$VN" >> "$GITHUB_ENV"

      # N+1 : la version suivante, signée, servie comme GitHub sert latest.json.
      - name: La version N+1, signée
        shell: bash
        run: |
          VN1=$(python -c "import os; n = os.environ['VN'].split('+')[0].split('-')[0].split('.'); print(f'{n[0]}.{n[1]}.{int(n[2]) + 1}')")
          sed -i -E "0,/^version = /s/^version = \".*\"/version = \"$VN1\"/" crates/glucose-desktop/Cargo.toml
          cargo build --release -p glucose-desktop
          mkdir -p "$RUNNER_TEMP/n1" "$RUNNER_TEMP/serveur"
          cp target/release/glucose-desktop.exe "$RUNNER_TEMP/n1/"
          INSTALLEUR=$(python outils/installeur/construire.py "$RUNNER_TEMP/n1/glucose-desktop.exe" "$RUNNER_TEMP/serveur" | tail -1)
          npx --yes @tauri-apps/cli@2 signer sign -f "$RUNNER_TEMP/cle-d-essai.key" -p essai "$INSTALLEUR"
          export SIG="$(cat "$INSTALLEUR.sig")" VN1 NOM="$(basename "$INSTALLEUR")"
          python -c "import json, os; print(json.dumps({'version': os.environ['VN1'], 'notes': 'epreuve', 'pub_date': '2026-01-01T00:00:00Z', 'platforms': {'windows-x86_64': {'signature': os.environ['SIG'], 'url': 'http://127.0.0.1:8765/' + os.environ['NOM']}}}))" > "$RUNNER_TEMP/serveur/latest.json"
          echo "VN1=$VN1" >> "$GITHUB_ENV"

      # Glucose Tauri tel que ses utilisateurs l'ont : la release publique 1.0.2-beta.1.
      - name: Glucose Tauri
        shell: bash
        run: curl -sSfL -o "$RUNNER_TEMP/tauri-setup.exe" https://github.com/shazamifius/GlucoseGit/releases/download/v1.0.2-beta.1/Glucose_1.0.2-beta.1_x64-setup.exe

      - name: La vie entière de Glucose sous Windows
        shell: pwsh
        run: ./outils/installeur/eprouver.ps1 -Tauri "$env:RUNNER_TEMP\tauri-setup.exe" -Installeur $env:INSTALLEUR_N -Version $env:VN -Serveur "$env:RUNNER_TEMP\serveur" -VersionSuivante $env:VN1

  # La répétition générale de la bascule (fiche 48) : Glucose Tauri, reconstruit depuis sa
  # source publiée avec une clé d'essai, se met à jour PAR SON PROPRE UPDATER vers Glucose Rust.
  repetition:
    name: Windows, la répétition générale de la bascule
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          ref: v1.0.2-beta.1
          path: tauri-source

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { choco install nsis -y --no-progress }

      - name: Clé d'essai
        shell: bash
        run: |
          npx --yes @tauri-apps/cli@2 signer generate --ci -p essai -w "$RUNNER_TEMP/cle-d-essai.key"
          echo "GLUCOSE_CLE_PUBLIQUE=$(cat "$RUNNER_TEMP/cle-d-essai.key.pub")" >> "$GITHUB_ENV"
          echo "GLUCOSE_MISE_A_JOUR=http://127.0.0.1:8765/latest.json" >> "$GITHUB_ENV"

      # Avant le cache de Rust, qui lit chaque caisse : extraite dans notre dépôt, celle de Tauri
      # ne se lit qu'une fois déclarée son propre espace de travail.
      - name: Glucose Tauri, préparé pour la répétition
        shell: bash
        run: python outils/installeur/preparer_tauri.py tauri-source "$GLUCOSE_CLE_PUBLIQUE"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tauri-source/src-tauri -> target

      # Glucose Rust et son installeur, signé et servi comme GitHub sert latest.json — aux deux
      # clés que l'updater de Tauri lit sous Windows.
      - name: Glucose Rust, signé et servi
        shell: bash
        run: |
          cargo build --release -p glucose-desktop
          mkdir -p "$RUNNER_TEMP/rust" "$RUNNER_TEMP/serveur"
          cp target/release/glucose-desktop.exe "$RUNNER_TEMP/rust/"
          INSTALLEUR=$(python outils/installeur/construire.py "$RUNNER_TEMP/rust/glucose-desktop.exe" "$RUNNER_TEMP/serveur" | tail -1)
          npx --yes @tauri-apps/cli@2 signer sign -f "$RUNNER_TEMP/cle-d-essai.key" -p essai "$INSTALLEUR"
          VN=$("$RUNNER_TEMP/rust/glucose-desktop.exe" --version | cut -d' ' -f2)
          export SIG="$(cat "$INSTALLEUR.sig")" VN NOM="$(basename "$INSTALLEUR")"
          python -c "import json, os; e = {'signature': os.environ['SIG'], 'url': 'http://127.0.0.1:8765/' + os.environ['NOM']}; print(json.dumps({'version': os.environ['VN'], 'notes': 'repetition', 'pub_date': '2026-01-01T00:00:00Z', 'platforms': {'windows-x86_64': e, 'windows-x86_64-nsis': e}}))" > "$RUNNER_TEMP/serveur/latest.json"
          echo "VN=$VN" >> "$GITHUB_ENV"

      # Ses dépendances figées par son package-lock.json et son Cargo.lock : l'outil de Tauri et
      # l'updater mêmes (2.10.1) que ceux de la release que ses utilisateurs ont.
      - name: Glucose Tauri, reconstruit pour la répétition
        shell: bash
        run: |
          cd tauri-source
          npm ci
          npx tauri build --bundles nsis -- --locked
          # Un chemin de Windows : PowerShell ne lance pas un chemin à la mode de bash (/d/a/...).
          echo "TAURI_SETUP=$(cygpath -w "$(ls "$PWD"/src-tauri/target/release/bundle/nsis/*-setup.exe)")" >> "$GITHUB_ENV"

      - name: La répétition générale
        shell: pwsh
        run: ./outils/installeur/repetition.ps1 -Tauri $env:TAURI_SETUP -Serveur "$env:RUNNER_TEMP\serveur" -Version $env:VN

  # La bascule et la mise à jour sous Linux (fiche 48), sous les trois formes que ses
  # utilisateurs de Glucose Tauri peuvent avoir : le .deb, le .rpm, l'AppImage. Construits sur
  # Ubuntu 22.04 : Glucose Tauri y était construit, et exige la même bibliothèque C (glibc 2.34) —
  # une machine plus récente produirait un Glucose qui refuse de se lancer chez eux.
  paquets-linux:
    name: Linux, les paquets et la mise à jour
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # appimagetool et le runtime des AppImage : des versions publiées, vérifiées par leur
      # empreinte — pas la « continue », qui change sous nos pieds.
      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev pkg-config rpm
          curl -sSfL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum -c
          curl -sSfL -o "$RUNNER_TEMP/runtime-x86_64" https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $RUNNER_TEMP/runtime-x86_64" | sha256sum -c
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          echo "RUNTIME=$RUNNER_TEMP/runtime-x86_64" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Clé d'essai
        run: |
          npx --yes @tauri-apps/cli@2 signer generate --ci -p essai -w "$RUNNER_TEMP/cle-d-essai.key"
          echo "GLUCOSE_CLE_PUBLIQUE=$(cat "$RUNNER_TEMP/cle-d-essai.key.pub")" >> "$GITHUB_ENV"
          echo "GLUCOSE_MISE_A_JOUR=http://127.0.0.1:8765/latest.json" >> "$GITHUB_ENV"

      - name: La version N et ses paquets
        run: |
          cargo build --release -p glucose-desktop
          bash outils/paquets/construire.sh target/release/glucose-desktop "$RUNNER_TEMP/n"
          echo "VN=$(target/release/glucose-desktop --version | cut -d' ' -f2)" >> "$GITHUB_ENV"

      # N+1 : ses trois paquets signés, et le latest.json aux clés de Tauri.
      - name: La version N+1, signée
        run: |
          VN1=$(python3 -c "import os; n = os.environ['VN'].split('+')[0].split('-')[0].split('.'); print(f'{n[0]}.{n[1]}.{int(n[2]) + 1}')")
          sed -i -E "0,/^version = /s/^version = \".*\"/version = \"$VN1\"/" crates/glucose-desktop/Cargo.toml
          cargo build --release -p glucose-desktop
          bash outils/paquets/construire.sh target/release/glucose-desktop "$RUNNER_TEMP/servi"
          for f in "$RUNNER_TEMP"/servi/Glucose*; do
            npx --yes @tauri-apps/cli@2 signer sign -f "$RUNNER_TEMP/cle-d-essai.key" -p essai "$f"
          done
          python3 - "$RUNNER_TEMP/servi" "$VN1" <<'FIN'
          import json, pathlib, sys
          d, v = pathlib.Path(sys.argv[1]), sys.argv[2]
          def entree(nom):
              return {"signature": (d / (nom + ".sig")).read_text().strip(), "url": "http://127.0.0.1:8765/" + nom}
          appimage = entree(f"Glucose_{v}_amd64.AppImage")
          plateformes = {
              "linux-x86_64": appimage,
              "linux-x86_64-appimage": appimage,
              "linux-x86_64-deb": entree(f"Glucose_{v}_amd64.deb"),
              "linux-x86_64-rpm": entree(f"Glucose-{v}-1.x86_64.rpm"),
          }
          (d / "latest.json").write_text(json.dumps({"version": v, "notes": "epreuve", "pub_date": "2026-01-01T00:00:00Z", "platforms": plateformes}))
          FIN
          echo "VN1=$VN1" >> "$GITHUB_ENV"

      # Glucose Tauri tel que ses utilisateurs l'ont : la release publique 1.0.2-beta.1.
      - name: Glucose Tauri
        run: |
          mkdir -p "$RUNNER_TEMP/tauri"
          B=https://github.com/shazamifius/GlucoseGit/releases/download/v1.0.2-beta.1
          curl -sSfL -o "$RUNNER_TEMP/tauri/tauri.deb" "$B/Glucose_1.0.2-beta.1_amd64.deb"
          curl -sSfL -o "$RUNNER_TEMP/tauri/tauri.rpm" "$B/Glucose-1.0.2-beta.1-1.x86_64.rpm"
          curl -sSfL -o "$RUNNER_TEMP/tauri/tauri.AppImage" "$B/Glucose_1.0.2-beta.1_amd64.AppImage"

      - name: La bascule et la mise à jour, sous chaque forme
        run: bash outils/paquets/eprouver.sh "$RUNNER_TEMP/tauri" "$RUNNER_TEMP/n" "$RUNNER_TEMP/servi" "$VN" "$VN1"
