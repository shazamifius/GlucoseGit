name: Signaler un bug
description: Quelque chose ne marche pas comme il devrait dans Glucose
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de le signaler. Plus le récit est précis, plus vite le
        défaut se retrouve.

  - type: dropdown
    id: version
    attributes:
      label: Quelle version de Glucose ?
      options:
        - Glucose Rust, compilé depuis la branche main
        - Glucose Tauri, installé depuis une release (version figée, plus corrigée)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Ce qui s'est passé
      description: Ce que vous attendiez, et ce que vous avez vu à la place.
      placeholder: "J'ai glissé une image depuis le navigateur, et une carte vide est apparue à la place."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Pour le reproduire
      placeholder: |
        1. Ouvrir Glucose
        2. Appuyer sur N et cliquer sur la feuille
        3. ...
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Système
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - Autre (à préciser plus bas)
    validations:
      required: true

  - type: input
    id: machine
    attributes:
      label: Carte graphique et écran
      description: Glucose choisit sa voie de rendu selon la machine, ces deux informations aident beaucoup.
      placeholder: "Intel Arc intégré + RTX 4060, écran 2560 × 1440 à 144 Hz"

  - type: input
    id: commit
    attributes:
      label: Commit
      description: Pour Glucose Rust, le résultat de `git rev-parse --short HEAD`.
      placeholder: "5d7adf5"

  - type: textarea
    id: extra
    attributes:
      label: Captures, fichier, sortie
      description: |
        Une capture d'écran, le fichier `.glucose` en cause, ou ce que Glucose a écrit dans le
        terminal si vous l'avez lancé avec `cargo run`.
