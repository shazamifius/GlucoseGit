name: Proposer une idée
description: Une fonctionnalité, un geste, une amélioration
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Une idée encore floue a sa place dans les
        [Discussions](https://github.com/shazamifius/GlucoseGit/discussions). Ce formulaire
        est pour une proposition déjà claire.

  - type: textarea
    id: need
    attributes:
      label: Ce qui vous manque
      description: La situation où vous en avez eu besoin. Le besoin compte plus que la solution.
      placeholder: "Quand je range une centaine de références, je ne retrouve plus celles d'un même artiste."
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Ce que vous imaginez
      description: À quoi ressemblerait le geste, et ce qu'il changerait à l'écran.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: Comment vous faites aujourd'hui
      description: Dans Glucose, dans un autre logiciel, ou à la main.

  - type: checkboxes
    id: tauri
    attributes:
      label: Glucose Tauri
      options:
        - label: Cette fonctionnalité existait dans Glucose Tauri, l'ancienne version
